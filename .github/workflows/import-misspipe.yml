name: Import MISSPipe source
on:
  push:
    paths:
      - '.github/workflows/import-misspipe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Clone upstream source
        run: |
          git clone --depth 1 https://codeberg.org/Kdroidwin/MISSPipe.git /tmp/misspipe-source
      - name: Import source excluding upstream workflows
        run: |
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/' /tmp/misspipe-source/ ./
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to import'
          else
            git commit -m 'Import MISSPipe source from Codeberg (excluding upstream workflows)'
            git push origin HEAD:main
          fi
