name: Android Debug (ARM64)
on:
  push:
    paths:
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install SDK packages
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          if [ -z "$SDKMGR" ]; then
            echo "::error::Cannot find sdkmanager under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "Using $SDKMGR"
          yes | "$SDKMGR" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMGR" --sdk_root="$SDK_ROOT" --channel=3 --list | grep -E 'platforms;android-37|build-tools;36' || true
          "$SDKMGR" --sdk_root="$SDK_ROOT" --channel=3 --install "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Debug APK
        working-directory: PipePipeClient
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2 --no-configuration-cache --stacktrace
      - name: Upload ARM64 Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MISSPipe-arm64-debug
          path: PipePipeClient/app/build/outputs/apk/debug/*arm64-v8a*debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MISSPipe-debug-reports
          path: |
            PipePipeClient/app/build/reports/**
            PipePipeClient/build/reports/**
          if-no-files-found: ignore
